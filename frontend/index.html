<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap"></noscript>
<!-- base → desktop → mobile: each layer may override the one before it. -->
<link rel="stylesheet" href="common/base.css">
<link rel="stylesheet" href="desktop/desktop.css">
<link rel="stylesheet" href="mobile/mobile.css">
</head>
<body>

<div id="actbar">
  <button class="act-btn" id="actAccount">◉<span class="act-label">Account</span></button>
  <button class="act-btn" id="actLabels">◆<span class="act-label">Labels</span></button>
  <button class="act-btn" id="actSettings">≡<span class="act-label">Settings</span></button>
  <button class="act-btn" id="actInstructions">?<span class="act-label">Help</span></button>
</div>

<div id="panelAccount" class="act-panel">
  <button class="act-action-btn" id="accountAddBtn">Add account</button>
  <button class="act-action-btn" id="accountRefreshTokenBtn">Refresh Token</button>
  <button class="act-action-btn" id="accountDeleteBtn">Delete Account</button>
</div>

<div id="panelLabels" class="act-panel">
  <div class="legend" id="legend"></div>
</div>

<div id="panelInstructions" class="act-panel">
  <span class="panel-hint" id="appHint"></span>
</div>

<div id="panelSettings" class="act-panel">
  <div class="act-setting">
    <span class="act-setting-label">lang</span>
    <button class="lang-btn" id="langBtn" title="Switch language" aria-label="Switch language">EN</button>
  </div>
  <div class="act-setting">
    <span class="act-setting-label">scale</span>
    <div class="scale-btns" id="scaleBtns"></div>
  </div>
  <div class="act-setting">
    <span class="act-setting-label" id="customLoadLabel">progressive load</span>
    <button class="lang-btn" id="customLoadBtn" aria-pressed="false">OFF</button>
  </div>
</div>

<div id="main">
  <header>
    <div class="header-left">
      <h1 id="appTitle">weekly planner</h1>
    </div>
    <div role="toolbar" style="display:flex;align-items:center;gap:8px">
      <button class="add-day-btn" id="addUnscheduledBtn" style="display:none">+ unscheduled</button>
      <button class="add-day-btn" id="addDayBtn">+ add day</button>
      <div class="add-day-form" id="addDayForm">
        <input type="text" id="newDayLabel" placeholder="Mon" maxlength="12" />
        <input type="text" id="newDayDate" class="date-in" placeholder="04/28" maxlength="10" />
        <button id="addDayConfirm">add</button>
        <button id="addDayCancel">cancel</button>
      </div>
    </div>
  </header>
  <div class="board" id="board"></div>
</div>

<!--
  Three layers, loaded in dependency order. There is no bundler: these are
  plain deferred scripts sharing one global scope, so the order below IS the
  dependency graph.

    common/   view-agnostic — model, API, dates, i18n, shared widgets
    desktop/  desktop-only DOM and gestures
    mobile/   mobile-only DOM and gestures

  Both renderers are always loaded (the viewport can cross the breakpoint at
  any time) but only the one view.js selects ever renders. common/ must never
  reference a symbol from desktop/ or mobile/, and those two must never
  reference each other.
-->
<script defer src="common/constants.js"></script>
<script defer src="common/i18n.js"></script>
<script defer src="common/api.js"></script>
<script defer src="common/undo.js"></script>
<script defer src="common/collapse.js"></script>
<script defer src="common/state.js"></script>
<script defer src="common/dates.js"></script>
<script defer src="common/columns.js"></script>
<script defer src="common/tasks.js"></script>
<script defer src="common/types.js"></script>
<script defer src="common/settings.js"></script>
<script defer src="common/modal.js"></script>
<script defer src="common/add-label-panel.js"></script>
<script defer src="common/view.js"></script>
<script defer src="common/showcase.js"></script>

<script defer src="desktop/collapse-view.js"></script>
<script defer src="desktop/legend.js"></script>
<script defer src="desktop/context-menu.js"></script>
<script defer src="desktop/board.js"></script>
<script defer src="desktop/chrome.js"></script>

<script defer src="mobile/mobile.js"></script>

<script defer src="common/boot.js"></script>
</body>
</html>
